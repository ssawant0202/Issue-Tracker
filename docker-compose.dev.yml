services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: issue_tracker-v2
      MYSQL_ROOT_PASSWORD: Siddhesh@20
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:Siddhesh%4020@db:3306/issue_tracker-v2
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - db

volumes:
  mysql_data: